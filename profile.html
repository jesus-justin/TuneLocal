<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneLocal - User Profile</title>
    <meta name="description" content="TuneLocal: Manage your profile and preferences">
    <meta name="theme-color" content="#1db954">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231db954'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='64' font-family='Segoe UI Emoji'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            background: rgba(40, 40, 40, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            flex-shrink: 0;
            border: 3px solid var(--primary-color);
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .profile-username {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .profile-stats {
            display: flex;
            gap: 2rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .profile-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .profile-tab {
            padding: 1rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .profile-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .profile-content {
            display: none;
        }

        .profile-content.active {
            display: block;
        }

        .profile-section {
            background: rgba(40, 40, 40, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group textarea {
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(29, 185, 84, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, #1ed760 100%);
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(29, 185, 84, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background: rgba(255, 0, 80, 0.2);
            color: #ff6b9d;
            border: 1px solid rgba(255, 0, 80, 0.3);
        }

        .btn-danger:hover {
            background: rgba(255, 0, 80, 0.3);
        }

        .message {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            display: none;
        }

        .message.success {
            background: rgba(29, 185, 84, 0.2);
            color: #1db954;
        }

        .message.error {
            background: rgba(255, 0, 80, 0.2);
            color: #ff6b9d;
        }

        .message.show {
            display: flex;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .profile-stats {
                justify-content: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Include navbar from main app -->
    <nav class="navbar" id="navbar-placeholder"></nav>

    <div class="profile-container">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-avatar" id="profileAvatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="profile-info">
                <div class="profile-name" id="profileName">Loading...</div>
                <div class="profile-username" id="profileUsername">@username</div>
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="joinDate">-</div>
                        <div class="stat-label">Member Since</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="lastLogin">-</div>
                        <div class="stat-label">Last Login</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Profile Tabs -->
        <div class="profile-tabs">
            <button class="profile-tab active" onclick="switchProfileTab('account')">
                <i class="fas fa-user-circle"></i> Account
            </button>
            <button class="profile-tab" onclick="switchProfileTab('settings')">
                <i class="fas fa-sliders-h"></i> Settings
            </button>
            <button class="profile-tab" onclick="switchProfileTab('security')">
                <i class="fas fa-lock"></i> Security
            </button>
        </div>

        <!-- Account Tab -->
        <div id="account" class="profile-content active">
            <div class="profile-section">
                <div class="section-title">
                    <i class="fas fa-user"></i> Account Information
                </div>

                <div id="accountMessage" class="message"></div>

                <form id="accountForm" onsubmit="handleUpdateProfile(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" placeholder="John">
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" placeholder="Doe">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="your@email.com" readonly>
                    </div>

                    <div class="form-group">
                        <label for="bio">Bio</label>
                        <textarea id="bio" placeholder="Tell us about yourself" rows="4"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="favoriteGenre">Favorite Genre</label>
                            <input type="text" id="favoriteGenre" placeholder="e.g., Pop, Rock, Jazz">
                        </div>
                        <div class="form-group">
                            <label for="country">Country</label>
                            <input type="text" id="country" placeholder="Your country">
                        </div>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Save Changes
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="location.reload()">
                            <i class="fas fa-redo"></i> Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="settings" class="profile-content">
            <div class="profile-section">
                <div class="section-title">
                    <i class="fas fa-sliders-h"></i> Preferences
                </div>

                <div id="settingsMessage" class="message"></div>

                <form id="settingsForm" onsubmit="handleUpdateSettings(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="theme">Theme</label>
                            <select id="theme" style="padding: 0.85rem 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: var(--text-primary); font-size: 1rem;">
                                <option value="dark">Dark</option>
                                <option value="light">Light</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="language">Language</label>
                            <select id="language" style="padding: 0.85rem 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: var(--text-primary); font-size: 1rem;">
                                <option value="en">English</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                            </select>
                        </div>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Save Settings
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Security Tab -->
        <div id="security" class="profile-content">
            <div class="profile-section">
                <div class="section-title">
                    <i class="fas fa-lock"></i> Change Password
                </div>

                <div id="securityMessage" class="message"></div>

                <form id="securityForm" onsubmit="handleChangePassword(event)">
                    <div class="form-group">
                        <label for="oldPassword">Current Password</label>
                        <input type="password" id="oldPassword" placeholder="Enter your current password" required>
                    </div>

                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmNewPassword">Confirm New Password</label>
                        <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check"></i> Update Password
                        </button>
                    </div>
                </form>
            </div>

            <div class="profile-section">
                <div class="section-title">
                    <i class="fas fa-sign-out-alt"></i> Session
                </div>

                <p style="margin-bottom: 1.5rem; color: var(--text-secondary);">
                    Log out from your account and return to the login page.
                </p>

                <div class="btn-group">
                    <button type="button" class="btn btn-danger" onclick="handleLogout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'api/auth.php';

        async function loadProfile() {
            try {
                const response = await fetch(`${API_BASE}?action=check`);
                const data = await response.json();

                if (!data.authenticated) {
                    window.location.href = 'login.html';
                    return;
                }

                const user = data.user;

                // Update profile header
                document.getElementById('profileName').textContent = `${user.firstName || ''} ${user.lastName || ''}`.trim() || user.username;
                document.getElementById('profileUsername').textContent = `@${user.username}`;
                document.getElementById('email').value = user.email;

                // Update form fields
                document.getElementById('firstName').value = user.firstName || '';
                document.getElementById('lastName').value = user.lastName || '';
                document.getElementById('bio').value = user.bio || '';
                document.getElementById('favoriteGenre').value = user.favoriteGenre || '';
                document.getElementById('country').value = user.country || '';
                document.getElementById('theme').value = user.theme || 'dark';
                document.getElementById('language').value = user.language || 'en';

                // Format dates
                if (user.createdAt) {
                    const createdDate = new Date(user.createdAt);
                    document.getElementById('joinDate').textContent = createdDate.toLocaleDateString('en-US', { 
                        month: 'short', 
                        year: 'numeric' 
                    });
                }

                if (user.lastLogin) {
                    const lastLoginDate = new Date(user.lastLogin);
                    document.getElementById('lastLogin').textContent = lastLoginDate.toLocaleDateString('en-US', { 
                        month: 'short', 
                        day: 'numeric' 
                    });
                }

                // Update avatar
                const initials = ((user.firstName || '')[0] + (user.lastName || '')[0]).toUpperCase() || user.username[0].toUpperCase();
                document.getElementById('profileAvatar').textContent = initials;
            } catch (error) {
                console.error('Error loading profile:', error);
                window.location.href = 'login.html';
            }
        }

        function switchProfileTab(tab) {
            document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.profile-content').forEach(c => c.classList.remove('active'));

            document.querySelector(`[onclick="switchProfileTab('${tab}')"]`).classList.add('active');
            document.getElementById(tab).classList.add('active');

            // Clear messages
            document.querySelectorAll('.message').forEach(m => m.classList.remove('show'));
        }

        function showMessage(elementId, message, type) {
            const messageEl = document.getElementById(elementId);
            messageEl.innerHTML = `
                <i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i>
                ${message}
            `;
            messageEl.className = `message ${type} show`;
            setTimeout(() => messageEl.classList.remove('show'), 5000);
        }

        async function handleUpdateProfile(event) {
            event.preventDefault();
            const form = event.target;
            form.classList.add('loading');

            try {
                const response = await fetch(`${API_BASE}?action=update-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        firstName: document.getElementById('firstName').value,
                        lastName: document.getElementById('lastName').value,
                        bio: document.getElementById('bio').value,
                        favoriteGenre: document.getElementById('favoriteGenre').value,
                        country: document.getElementById('country').value
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('accountMessage', 'Profile updated successfully!', 'success');
                } else {
                    showMessage('accountMessage', data.error || 'Failed to update profile', 'error');
                }
            } catch (error) {
                showMessage('accountMessage', 'Network error. Please try again.', 'error');
            }

            form.classList.remove('loading');
        }

        async function handleUpdateSettings(event) {
            event.preventDefault();
            const form = event.target;
            form.classList.add('loading');

            try {
                const response = await fetch(`${API_BASE}?action=update-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        theme: document.getElementById('theme').value,
                        language: document.getElementById('language').value
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('settingsMessage', 'Settings updated successfully!', 'success');
                } else {
                    showMessage('settingsMessage', data.error || 'Failed to update settings', 'error');
                }
            } catch (error) {
                showMessage('settingsMessage', 'Network error. Please try again.', 'error');
            }

            form.classList.remove('loading');
        }

        async function handleChangePassword(event) {
            event.preventDefault();
            const form = event.target;
            form.classList.add('loading');

            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmPassword) {
                showMessage('securityMessage', 'New passwords do not match', 'error');
                form.classList.remove('loading');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}?action=change-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldPassword, newPassword, confirmPassword })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('securityMessage', 'Password changed successfully!', 'success');
                    form.reset();
                } else {
                    showMessage('securityMessage', data.error || 'Failed to change password', 'error');
                }
            } catch (error) {
                showMessage('securityMessage', 'Network error. Please try again.', 'error');
            }

            form.classList.remove('loading');
        }

        async function handleLogout() {
            try {
                await fetch(`${API_BASE}?action=logout`, { method: 'POST' });
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = 'login.html';
            }
        }

        // Load profile on page load
        loadProfile();
    </script>
</body>
</html>
